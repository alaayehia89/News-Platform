<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء حساب جديد - المنصة الإخبارية</title>
    <meta name="description" content="أنشئ حسابك المجاني لمتابعة آخر الأخبار">
    
    <!-- خط تجوال من Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- ملفات الـ CSS -->
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/auth.css">
</head>
<body>
    <!-- الهيدر المبسط -->
    <header>
        <div class="main-header">
            <div class="container">
                <div class="logo">
                    <a href="../index.html" style="display: flex; align-items: center; gap: 15px; text-decoration: none;">
                        <h1 style="color: var(--primary-color); font-size: 1.8rem;">المنصة الإخبارية</h1>
                    </a>
                </div>
                <a href="../index.html" class="btn btn-outline">← العودة للرئيسية</a>
            </div>
        </div>
    </header>
    
    <!-- نموذج التسجيل -->
    <div class="auth-container">
        <div class="auth-box">
            <div class="auth-header">
                <h1>حساب جديد</h1>
                <p>انضم إلينا وتابع آخر الأخبار على مدار الساعة</p>
            </div>
            
            <div id="alert-container"></div>
            
            <form id="registerForm" class="auth-form">
                <div class="form-group">
                    <label for="full_name">الاسم الكامل</label>
                    <input type="text" id="full_name" name="full_name" placeholder="محمد أحمد محمد" required>
                </div>
                
                <div class="form-group">
                    <label for="email">البريد الإلكتروني</label>
                    <input type="email" id="email" name="email" placeholder="example@domain.com" required>
                </div>
                
                <div class="form-group">
                    <label for="password">كلمة المرور</label>
                    <div class="password-toggle">
                        <input type="password" id="password" name="password" placeholder="••••••••" minlength="8" required>
                        <button type="button" onclick="togglePassword('password')" aria-label="إظهار كلمة المرور">👁️</button>
                    </div>
                    <small style="color: var(--text-light); font-size: 0.85rem;">يجب أن تكون 8 أحرف على الأقل</small>
                </div>
                
                <div class="form-group">
                    <label for="confirm_password">تأكيد كلمة المرور</label>
                    <div class="password-toggle">
                        <input type="password" id="confirm_password" name="confirm_password" placeholder="••••••••" minlength="8" required>
                        <button type="button" onclick="togglePassword('confirm_password')" aria-label="إظهار كلمة المرور">👁️</button>
                    </div>
                </div>
                
                <div class="checkbox-group">
                    <input type="checkbox" id="terms" name="terms" required>
                    <label for="terms">أوافق على <a href="#">الشروط والأحكام</a> و<a href="#">سياسة الخصوصية</a></label>
                </div>
                
                <button type="submit" class="btn-submit">إنشاء الحساب</button>
            </form>
            
            <div class="auth-divider">
                <span>أو</span>
            </div>
            
            <div class="social-auth">
                <button class="social-btn" type="button">
                    <span>🔵</span> جوجل
                </button>
                <button class="social-btn" type="button">
                    <span>📘</span> فيسبوك
                </button>
            </div>
            
            <div class="auth-footer">
                <p>لديك حساب بالفعل؟ <a href="login.html">تسجيل الدخول</a></p>
            </div>
        </div>
    </div>
    
    <!-- الفوتر المبسط -->
    <footer style="margin-top: auto;">
        <div class="container">
            <div class="footer-bottom">
                <p>جميع الحقوق محفوظة © 2025 المنصة الإخبارية</p>
            </div>
        </div>
    </footer>
    
    <!-- ملف الجافاسكربت -->
    <script src="../assets/js/auth.js"></script>
</body>
</html>
